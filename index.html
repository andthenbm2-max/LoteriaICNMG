<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#151515">
  <title>Christian Lotería</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      color: white;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;

      /* Uses your existing background if you upload it beside index.html */
      background:
        linear-gradient(rgba(0,0,0,.58), rgba(0,0,0,.72)),
        url("Background.png") center/cover no-repeat,
        #151515;
    }

    .container {
      width: min(920px, 92vw);
      text-align: center;
      padding: 40px 20px;
    }

    .cross {
      font-size: clamp(2.5rem, 7vw, 4.5rem);
      line-height: 1;
      margin-bottom: 12px;
      text-shadow: 0 4px 18px rgba(0,0,0,.5);
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 4.2rem);
      letter-spacing: .08em;
      text-transform: uppercase;
      text-shadow: 0 4px 18px rgba(0,0,0,.6);
    }

    .subtitle {
      margin: 12px 0 42px;
      font-size: clamp(1rem, 2.5vw, 1.35rem);
      opacity: .88;
    }

    .options {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px;
      max-width: 760px;
      margin: 0 auto;
    }

    .option {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 230px;
      padding: 30px 24px;
      border: 2px solid rgba(255,255,255,.75);
      border-radius: 24px;
      background: rgba(20,20,20,.72);
      color: white;
      text-decoration: none;
      backdrop-filter: blur(8px);
      box-shadow: 0 12px 35px rgba(0,0,0,.35);
      transition:
        transform .18s ease,
        background .18s ease,
        box-shadow .18s ease;
    }

    .option:hover {
      transform: translateY(-6px);
      background: rgba(255,255,255,.14);
      box-shadow: 0 18px 45px rgba(0,0,0,.5);
    }

    .option:active {
      transform: translateY(-1px);
    }

    .icon {
      font-size: 4rem;
      margin-bottom: 15px;
    }

    .title {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: .05em;
      text-transform: uppercase;
    }

    .description {
      margin-top: 9px;
      font-size: 1rem;
      opacity: .78;
    }

    .footer {
      margin-top: 38px;
      font-size: .8rem;
      opacity: .55;
    }

    @media (max-width: 650px) {
      body {
        overflow-y: auto;
      }

      .container {
        padding: 30px 15px;
      }

      .options {
        grid-template-columns: 1fr;
        gap: 16px;
      }

      .option {
        min-height: 180px;
      }

      .subtitle {
        margin-bottom: 28px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="cross">✝</div>

    <h1>Christian Lotería</h1>

    <div class="subtitle">
      Choose how you want to play
    </div>

    <div class="options">

      <!-- PLAYER -->
      <a class="option" href="Player.html">
        <div class="icon">🎴</div>
        <div class="title">Player</div>
        <div class="description">Play with your own Lotería board</div>
      </a>

      <!-- CALLER -->
      <a class="option" href="Caller.html">
        <div class="icon">📢</div>
        <div class="title">Caller</div>
        <div class="description">Call cards and control the game</div>
      </a>

    </div>

    <div class="footer">
      Christian Lotería
    </div>

  </main>

</body>
</html>
