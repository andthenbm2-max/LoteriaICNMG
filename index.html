<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#151515">
  <title>Lotería de la Fe</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; font-family: Arial, Helvetica, sans-serif; color: white; }
    body {
      min-height: 100vh; min-height: 100dvh;
      display: flex; align-items: center; justify-content: center; overflow: hidden;
      background: linear-gradient(rgba(0,0,0,.58), rgba(0,0,0,.72)), url("Background.png") center/cover no-repeat, #151515;
    }
    .container {
      width: min(920px, 94vw); height: 100%; max-height: 100dvh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; overflow: hidden;
      padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
    }
    .cross {
      font-size: clamp(1.8rem, min(6vw, 6dvh), 3.8rem); line-height: 1;
      margin-bottom: clamp(4px, 1dvh, 10px); flex: 0 0 auto;
      text-shadow: 0 4px 18px rgba(0,0,0,.5);
    }
    h1 {
      margin: 0; font-size: clamp(1.7rem, min(6.5vw, 7dvh), 4rem); line-height: 1.05;
      letter-spacing: .08em; text-transform: uppercase; flex: 0 0 auto;
      text-shadow: 0 4px 18px rgba(0,0,0,.6);
    }
    .subtitle {
      margin: clamp(5px, 1dvh, 12px) 0 clamp(12px, 2.5dvh, 28px);
      font-size: clamp(.85rem, min(2.5vw, 3dvh), 1.3rem); line-height: 1.2;
      opacity: .88; flex: 0 0 auto;
    }
    .options {
      width: min(760px, 100%); display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: clamp(10px, 2vw, 24px); flex: 0 1 auto; min-height: 0;
    }
    .option {
      min-width: 0; min-height: 0; height: clamp(170px, 34dvh, 250px);
      padding: clamp(12px, 2.5dvh, 28px) clamp(12px, 2.5vw, 24px);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      border: 2px solid rgba(255,255,255,.75); border-radius: clamp(16px, 2.5vw, 24px);
      background: rgba(20,20,20,.72); color: white; text-decoration: none;
      backdrop-filter: blur(8px); box-shadow: 0 12px 35px rgba(0,0,0,.35);
      overflow: hidden; transition: transform .18s ease, background .18s ease, box-shadow .18s ease;
    }
    .option:hover { transform: translateY(-4px); background: rgba(255,255,255,.14); box-shadow: 0 18px 45px rgba(0,0,0,.5); }
    .option:active { transform: translateY(-1px); }
    .icon { font-size: clamp(2rem, min(5vw, 7dvh), 4rem); line-height: 1; margin-bottom: clamp(6px, 1.5dvh, 15px); flex: 0 0 auto; }
    .title { font-size: clamp(1.15rem, min(3vw, 4dvh), 1.8rem); line-height: 1.1; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; flex: 0 0 auto; }
    .description { max-width: 95%; margin-top: clamp(5px, 1dvh, 9px); font-size: clamp(.72rem, min(1.8vw, 2.2dvh), 1rem); line-height: 1.25; opacity: .78; flex: 0 1 auto; }
    .footer { margin-top: clamp(8px, 2dvh, 18px); font-size: clamp(.65rem, 1.5vw, .8rem); opacity: .55; flex: 0 0 auto; }
    @media (max-width: 650px) {
      .container { width: 96vw; }
      .options { grid-template-columns: 1fr; gap: clamp(8px, 1.5dvh, 16px); width: min(520px, 100%); }
      .option { height: clamp(125px, 18dvh, 180px); }
      .subtitle { margin-bottom: clamp(8px, 1.8dvh, 20px); }
    }
    @media (orientation: landscape) and (max-height: 500px) {
      .container { width: 96vw; padding-top: 8px; padding-bottom: 8px; }
      .cross { display: none; }
      h1 { font-size: clamp(1.35rem, 6dvh, 2.4rem); }
      .subtitle { margin: 3px 0 8px; }
      .option { height: min(58dvh, 190px); }
      .footer { margin-top: 6px; }
    }
  
    @media (orientation: landscape) {
      .container {
        width: min(1180px, 96vw);
        padding-left: max(12px, env(safe-area-inset-left));
        padding-right: max(12px, env(safe-area-inset-right));
      }

      .options {
        width: 100%;
        max-width: 1120px;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: clamp(10px, 1.8vw, 22px);
      }

      .option {
        height: clamp(145px, 46dvh, 225px);
        padding: clamp(10px, 2dvh, 20px) clamp(10px, 1.5vw, 22px);
      }

      .icon {
        font-size: clamp(2rem, 7dvh, 3.5rem);
        margin-bottom: clamp(5px, 1dvh, 10px);
      }

      .title {
        font-size: clamp(1.1rem, 3.2dvh, 1.65rem);
      }

      .description {
        font-size: clamp(.7rem, 2.1dvh, .95rem);
      }

      .footer {
        margin-top: clamp(5px, 1.5dvh, 12px);
      }
    }

    /* Short landscape screens, such as phones rotated sideways. */
    @media (orientation: landscape) and (max-height: 500px) {
      .container {
        width: 97vw;
        padding-top: 6px;
        padding-bottom: 6px;
      }

      .options {
        max-width: 1160px;
        gap: clamp(8px, 1.5vw, 16px);
      }

      .option {
        height: min(52dvh, 175px);
        border-radius: 16px;
      }

      .icon {
        font-size: clamp(1.7rem, 8dvh, 2.8rem);
        margin-bottom: 5px;
      }

      .title {
        font-size: clamp(1rem, 3.8dvh, 1.45rem);
      }

      .description {
        font-size: clamp(.64rem, 2.5dvh, .82rem);
      }
    }
</style>
</head>
<body>
  <main class="container">
    <div class="cross">📲</div>
    <h1>Lotería de la Fe</h1>
    <div class="subtitle">Elige tu rol:</div>
    <div class="options">
      <a class="option" href="Player.html">
        <div class="icon">🎴</div>
        <div class="title">Jugador</div>
        <div class="description">Para generar un tablero aleatorio y que alguien más las cante</div>
      </a>
      <a class="option" href="Caller.html">
        <div class="icon">📢</div>
        <div class="title">Caller</div>
        <div class="description">Para cantar las cartas y que el jugador las marque</div>
      </a>

      <!-- MODO SOLO -->
      <a class="option" href="Solo.html">
        <div class="icon">🎯</div>
        <div class="title">Modo Solo</div>
        <div class="description">Juega tú solo: las cartas se cantan automáticamente según la dificultad</div>
      </a>
    </div>
    <div class="footer">Lotería Cristiana</div>
  </main>
</body>
</html>
