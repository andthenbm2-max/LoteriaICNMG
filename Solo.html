<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#151515">
<title>Lotería de la Fe — Modo Solo</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  font-family: Arial, Helvetica, sans-serif;
  color: #fff;
  background: #151515;
}

body {
  min-height: 100vh;
  min-height: 100dvh;
  overflow: hidden;
  background:
    linear-gradient(rgba(0,0,0,.48), rgba(0,0,0,.76)),
    url("Background.png") center/cover fixed no-repeat,
    #151515;
}

.app {
  width: 100%;
  height: 100vh;
  height: 100dvh;
  padding:
    max(8px, env(safe-area-inset-top))
    max(8px, env(safe-area-inset-right))
    max(8px, env(safe-area-inset-bottom))
    max(8px, env(safe-area-inset-left));
  display: flex;
  flex-direction: column;
  gap: clamp(6px, 1vw, 12px);
  overflow: hidden;
}

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex: 0 0 auto;
}

h1 {
  margin: 0;
  font-size: clamp(1rem, 2.6vw, 1.7rem);
  line-height: 1.1;
  letter-spacing: .035em;
}

.controls {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  justify-content: flex-end;
}

button {
  min-height: 40px;
  padding: 8px 12px;
  border: 1px solid rgba(255,255,255,.35);
  border-radius: 10px;
  color: #fff;
  background: rgba(20,20,20,.82);
  font: inherit;
  cursor: pointer;
}

button:hover { background: rgba(255,255,255,.14); }
button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }

.primary {
  border-color: rgba(255,255,255,.72);
  background: rgba(255,255,255,.16);
}

/* Current card + previously called cards */
.called-bar {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  padding: 7px 8px;
  border-radius: 13px;
  background: rgba(10,10,10,.66);
  border: 1px solid rgba(255,255,255,.15);
}

.called-label {
  flex: 0 0 auto;
  font-size: .72rem;
  font-weight: 800;
  opacity: .7;
  writing-mode: vertical-rl;
  transform: rotate(180deg);
}

.current-slot {
  flex: 0 0 auto;
  width: clamp(62px, 7vw, 78px);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 2px 3px 3px;
  border-radius: 9px;
  background: rgba(72,214,107,.08);
  border: 1px solid rgba(72,214,107,.24);
}

.current-slot-label {
  font-size: .55rem;
  line-height: 1;
  font-weight: 900;
  letter-spacing: .08em;
  color: #67e887;
  opacity: .9;
}

.current-card {
  position: relative;
  width: clamp(49px, 6vw, 64px);
  aspect-ratio: 7 / 10;
  border-radius: 7px;
  overflow: hidden;
  border: 2px solid rgba(72,214,107,.95);
  background: #111;
  box-shadow: 0 0 0 1px rgba(72,214,107,.15), 0 4px 12px rgba(0,0,0,.3);
}

.current-card.empty {
  display: grid;
  place-items: center;
  color: rgba(255,255,255,.35);
  font-size: 1.25rem;
  border-color: rgba(72,214,107,.3);
  box-shadow: none;
}

.current-card img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.current-number {
  position: absolute;
  left: 3px;
  top: 3px;
  min-width: 17px;
  padding: 2px 4px;
  border-radius: 5px;
  background: rgba(0,0,0,.72);
  font-size: .58rem;
  font-weight: 800;
  text-align: center;
}

.history-divider {
  flex: 0 0 1px;
  align-self: stretch;
  margin: 3px 2px;
  background: rgba(255,255,255,.16);
}

.called-scroll {
  min-width: 0;
  flex: 1 1 auto;
  display: flex;
  gap: 7px;
  overflow-x: auto;
  overflow-y: hidden;
  padding: 1px 2px 3px;
  scrollbar-width: thin;
  scroll-snap-type: x proximity;
  touch-action: pan-x;
}

.called-scroll::-webkit-scrollbar { height: 5px; }
.called-scroll::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,.3);
  border-radius: 99px;
}

.called-card {
  position: relative;
  flex: 0 0 auto;
  width: clamp(43px, 5.3vw, 62px);
  aspect-ratio: 7 / 10;
  border-radius: 7px;
  overflow: hidden;
  border: 2px solid rgba(255,255,255,.17);
  background: #111;
  scroll-snap-align: start;
}

.called-card img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.called-number {
  position: absolute;
  left: 3px;
  top: 3px;
  min-width: 17px;
  padding: 2px 4px;
  border-radius: 5px;
  background: rgba(0,0,0,.72);
  font-size: .58rem;
  font-weight: 800;
  text-align: center;
}

.called-empty {
  display: flex;
  align-items: center;
  min-height: 45px;
  padding: 0 8px;
  opacity: .55;
  font-size: .78rem;
}
.status {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  padding: 6px 10px;
  border-radius: 11px;
  background: rgba(10,10,10,.5);
  border: 1px solid rgba(255,255,255,.12);
  font-size: clamp(.72rem, 1.7vw, .9rem);
}

#progress { font-weight: 800; }
#currentCall { opacity: .78; }

.board-area {
  min-height: 0;
  flex: 1 1 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.board {
  --columns: 4;
  --gap: 8px;
  --card-size: 100px;

  width: calc(var(--columns) * var(--card-size) + (var(--columns) - 1) * var(--gap));
  display: grid;
  grid-template-columns: repeat(var(--columns), var(--card-size));
  gap: var(--gap);
  justify-content: center;
  align-content: center;
}

.card {
  width: var(--card-size);
  aspect-ratio: 7 / 10;
  padding: 0;
  position: relative;
  overflow: hidden;
  border: 2px solid rgba(255,255,255,.38);
  border-radius: clamp(7px, 1vw, 13px);
  background: #111;
  box-shadow: 0 7px 18px rgba(0,0,0,.35);
  transition: transform .12s ease, border-color .12s ease, filter .12s ease;
}

.card img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.card:hover { transform: translateY(-2px); }

.card.called {
  border-color: rgba(255,255,255,.8);
}

.card.marked {
  border-color: rgba(255,255,255,.95);
  filter: brightness(.45) saturate(.7);
}

.card.marked::after {
  content: "✓";
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  font-size: clamp(1.8rem, 5vw, 3.2rem);
  font-weight: 900;
  color: #fff;
  text-shadow: 0 2px 8px #000;
  background: rgba(0,0,0,.18);
}

.card.flash {
  animation: flash .7s ease;
}

@keyframes flash {
  0%, 100% { transform: scale(1); }
  35% { transform: scale(1.045); }
}

.loading {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(0,0,0,.88);
}

.loading-box {
  width: min(420px, 90vw);
  padding: 24px;
  text-align: center;
  border-radius: 18px;
  background: #171717;
  border: 1px solid rgba(255,255,255,.2);
}

.loading-title {
  font-size: clamp(1.2rem, 4vw, 1.7rem);
  font-weight: 800;
  margin-bottom: 9px;
}

.loading-text {
  font-size: .9rem;
  opacity: .72;
  min-height: 20px;
}

.progress-track {
  height: 9px;
  margin-top: 16px;
  border-radius: 99px;
  overflow: hidden;
  background: rgba(255,255,255,.12);
}

#preloadProgress {
  width: 0%;
  height: 100%;
  background: #fff;
  transition: width .08s linear;
}

.overlay {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 14px;
  background: rgba(0,0,0,.76);
  backdrop-filter: blur(8px);
}

.panel {
  width: min(1000px, 96vw);
  max-height: 94vh;
  overflow: auto;
  padding: 18px;
  border-radius: 20px;
  background: rgba(18,18,18,.97);
  border: 1px solid rgba(255,255,255,.2);
}

.panel-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 14px;
}

.panel h2 {
  margin: 0;
  font-size: clamp(1.15rem, 3vw, 1.7rem);
}

.levels {
  display: grid;
  grid-template-columns: repeat(5, minmax(0,1fr));
  gap: 10px;
}

.level {
  min-width: 0;
  padding: 5px;
  border: 2px solid rgba(255,255,255,.18);
  border-radius: 12px;
  background: #111;
}

.level img {
  display: block;
  width: 100%;
  aspect-ratio: 7 / 10;
  object-fit: cover;
  border-radius: 7px;
}

.level.selected {
  border-color: #fff;
  box-shadow: 0 0 0 2px rgba(255,255,255,.18);
}

.level-caption {
  margin: 7px 2px 3px;
  font-size: .75rem;
  font-weight: 800;
}

.level-speed {
  margin: 0 2px 4px;
  font-size: .68rem;
  opacity: .62;
}

.panel-bottom {
  display: flex;
  justify-content: center;
  margin-top: 14px;
}

.victory {
  display: block;
  text-align: center;
}

.victory-gif {
  display: block;
  width: min(82vw, 520px);
  max-height: 58vh;
  margin: 0 auto 14px;
  object-fit: contain;
  border-radius: 14px;
}

.victory h2 { margin: 0 0 8px; }
.victory p { margin: 0 0 15px; opacity: .78; }

@media (max-width: 700px) {
  h1 { max-width: 45vw; }

  .controls button {
    min-height: 38px;
    padding: 7px 9px;
    font-size: .72rem;
  }

  .called-label { display: none; }
  .history-divider { margin-left: 1px; margin-right: 1px; }

  .levels {
    grid-template-columns: repeat(2, minmax(0,1fr));
  }

  .levels .level:last-child {
    grid-column: span 2;
    max-width: 50%;
    justify-self: center;
  }
}

/*
  Adaptive difficulty menu — same behavior as Player:
  landscape keeps 5 cards across; portrait uses 2×3 and sizes the
  entire grid from the available viewport height. Artwork remains 2:3.
*/
@media (orientation: portrait) {
  #levelOverlay .panel {
    width: min(96vw, 760px);
    height: calc(100dvh - 16px);
    max-height: calc(100dvh - 16px);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  #levelOverlay .panel-top {
    flex: 0 0 auto;
  }

  #levelOverlay .levels {
    width: min(
      94vw,
      calc((100dvh - 225px) / 2.25)
    );
    max-width: 760px;
    grid-template-columns: repeat(2, minmax(0,1fr));
    grid-auto-rows: auto;
    gap: 7px;
    align-self: center;
  }

  #levelOverlay .level {
    width: 100%;
    height: auto;
    min-height: 0;
    padding: 5px;
  }

  #levelOverlay .level img {
    width: 100%;
    height: auto;
    aspect-ratio: 2 / 3;
    object-fit: cover;
  }

  #levelOverlay .level:last-child {
    grid-column: 1 / -1;
    justify-self: center;
    width: calc((100% - 7px) / 2);
    max-width: none;
  }

  #levelOverlay .panel-bottom {
    flex: 0 0 auto;
    margin-top: 8px;
    padding-bottom: max(2px, env(safe-area-inset-bottom));
  }

  #levelOverlay .panel-bottom button {
    min-height: 42px;
    padding: 9px 18px;
  }
}

@media (orientation: portrait) and (max-height: 700px) {
  #levelOverlay .panel {
    gap: 4px;
    padding: 14px;
  }

  #levelOverlay .levels {
    width: min(
      94vw,
      calc((100dvh - 185px) / 2.25)
    );
    gap: 5px;
  }

  #levelOverlay .level-caption {
    margin-top: 5px;
    font-size: .68rem;
  }

  #levelOverlay .level-speed {
    margin-bottom: 2px;
    font-size: .62rem;
  }

  #levelOverlay .panel-bottom {
    margin-top: 5px;
    padding-bottom: max(2px, env(safe-area-inset-bottom));
  }

  #levelOverlay .panel-bottom button {
    padding: 9px 16px;
    font-size: 15px;
  }
}

@media (orientation: landscape) and (max-height: 520px) {
  .app { gap: 5px; }

  .called-bar { padding: 4px 6px; }
  .current-slot { width: 58px; }
  .current-card { width: 46px; }
  .called-card { width: 40px; }

  .status {
    padding: 4px 8px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .card, .card.flash { animation: none !important; transition: none !important; }
}
</style>
</head>

<body>

<main class="app">
  <header>
    <h1>🎴 Lotería de la Fe — Modo Solo</h1>
    <div class="controls">
      <button id="difficulty" type="button">DIFICULTAD</button>
      <button id="pause" type="button" class="primary">CONTINUAR</button>
      <button id="newGame" type="button">NUEVA PARTIDA</button>
    </div>
  </header>

  <section class="called-bar" aria-label="Carta actual y cartas previamente llamadas">
    <div class="called-label">CANTADAS</div>

    <div id="currentSlot" class="current-slot" aria-label="Carta actual">
      <div class="current-slot-label">AHORA</div>
      <div id="currentCard" class="current-card empty">
        <span>—</span>
      </div>
    </div>

    <div class="history-divider" aria-hidden="true"></div>

    <div id="calledScroll" class="called-scroll" aria-label="Cartas anteriores">
      <div id="calledEmpty" class="called-empty">Las cartas anteriores aparecerán aquí.</div>
    </div>
  </section>

  <section class="status" aria-live="polite">
    <div id="progress">0 de 16 marcadas</div>
    <div id="currentCall">Esperando para comenzar…</div>
  </section>

  <section class="board-area">
    <div id="board" class="board" aria-label="Tablero de Lotería"></div>
  </section>
</main>

<div id="loading" class="loading" aria-live="polite">
  <div class="loading-box">
    <div class="loading-title">Preparando la partida</div>
    <div id="preloadText" class="loading-text">Cargando cartas…</div>
    <div class="progress-track">
      <div id="preloadProgress"></div>
    </div>
  </div>
</div>

<div id="levelOverlay" class="overlay" aria-hidden="true">
  <div class="panel">
    <div class="panel-top">
      <h2>ELIGE LA DIFICULTAD</h2>
      <button id="closeLevels" type="button" aria-label="Cerrar">×</button>
    </div>

    <div class="levels">
      <button class="level" data-level="normal" type="button">
        <img src="Selection Menu/Normal.png" alt="Modo Normal">
        <div class="level-caption">MODO NORMAL</div>
        <div class="level-speed">1 carta cada 8 s</div>
      </button>

      <button class="level" data-level="peregrino" type="button">
        <img src="Selection Menu/Peregrino.png" alt="Peregrino">
        <div class="level-caption">PEREGRINO</div>
        <div class="level-speed">1 carta cada 6 s</div>
      </button>

      <button class="level" data-level="desierto" type="button">
        <img src="Selection Menu/Desierto.png" alt="El Desierto">
        <div class="level-caption">EL DESIERTO</div>
        <div class="level-speed">1 carta cada 4.5 s</div>
      </button>

      <button class="level" data-level="tribulacion" type="button">
        <img src="Selection Menu/Tribulacion.png" alt="La Tribulación">
        <div class="level-caption">LA TRIBULACIÓN</div>
        <div class="level-speed">1 carta cada 3 s</div>
      </button>

      <button class="level" data-level="apocalipsis" type="button">
        <img src="Selection Menu/Apocalipsis.png" alt="Apocalipsis">
        <div class="level-caption">APOCALIPSIS</div>
        <div class="level-speed">1 carta cada 2 s</div>
      </button>
    </div>

    <div class="panel-bottom">
      <button id="start" class="primary" type="button">COMENZAR</button>
    </div>
  </div>
</div>

<div id="victoryOverlay" class="overlay" aria-hidden="true">
  <div class="panel victory">
    <img id="gifVictory" class="victory-gif" src="gif/1.gif" alt="¡Lotería!">
    <h2>🎉 ¡LOTERÍA!</h2>
    <p id="victoryCountdown">Nueva partida en 7 segundos…</p>
    <button id="victoryNew" class="primary" type="button">NUEVA PARTIDA</button>
  </div>
</div>

<script>
const deck = [
  { nombre: "El Pastor", archivo: "El Pastor.png" },

const levels = {

  peregrino: { name: "Peregrino", interval: 6000 },
  desierto: { name: "El Desierto", interval: 4500 },

  apocalipsis: { name: "Apocalipsis", interval: 2000 }

const board = document.getElementById("board");
const progress = document.getElementById("progress");
const currentCall = document.getElementById("currentCall");
const calledScroll = document.getElementById("calledScroll");
const calledEmpty = document.getElementById("calledEmpty");

let boardCards = [];

let currentLevel = "normal";
let selectedLevel = "normal";
let timer = null;
let paused = true;
let imagesReady = false;

function shuffle(array) {
  const copy = [...array];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function preloadImages() {
  const total = deck.length;
  let loaded = 0;

  return Promise.all(deck.map(card => new Promise(resolve => {
    const img = new Image();

    const done = () => {
      loaded++;
      const pct = Math.round((loaded / total) * 100);
      preloadProgress.style.width = pct + "%";
      preloadText.textContent = `Cargando cartas… ${loaded} de ${total}`;
      resolve();
    };

    img.onload = done;
    img.onerror = done;
    img.src = "cards/" + card.archivo;
  })));
}

function calculateBoardLayout() {
  const area = document.querySelector(".board-area");
  const width = area.clientWidth;
  const height = area.clientHeight;

  if (!width || !height || boardCards.length === 0) return;

  const gap = Math.max(4, Math.min(10, Math.min(width, height) * 0.012));
  const padding = Math.max(2, Math.min(12, Math.min(width, height) * 0.01));

  const candidates = [2, 3, 4, 5, 6, 7, 8];
  let best = null;

  candidates.forEach(columns => {
    const rows = Math.ceil(boardCards.length / columns);
    const cardByWidth = (width - padding * 2 - gap * (columns - 1)) / columns;
    const cardByHeight = (height - padding * 2 - gap * (rows - 1)) / rows / (10 / 7);
    const size = Math.floor(Math.min(cardByWidth, cardByHeight));

    if (size <= 0) return;

    const score = size * size * 0.8 + (columns === 4 ? 100 : 0);

    if (!best || score > best.score) {
      best = { columns, size, score };
    }
  });

  if (!best) return;

  board.style.setProperty("--columns", best.columns);
  board.style.setProperty("--card-size", best.size + "px");
  board.style.setProperty("--gap", gap + "px");
}

function renderBoard() {
  board.innerHTML = "";

  boardCards.forEach((card, index) => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "card";
    button.dataset.index = index;
    button.setAttribute("aria-label", `${card.nombre}, sin marcar`);

    const img = document.createElement("img");
    img.src = "cards/" + card.archivo;
    img.alt = card.nombre;

    button.appendChild(img);

    button.addEventListener("click", () => {
      if (marked.has(index)) {
        marked.delete(index);
      } else {
        marked.add(index);
      }
      updateBoardCard(button, index);
      updateProgress();

      if (marked.size === boardCards.length) {
        showVictory();
      }
    });

    board.appendChild(button);
  });

  calculateBoardLayout();
  updateProgress();
}

function updateBoardCard(button, index) {
  const card = boardCards[index];
  const isMarked = marked.has(index);
  const wasCalled = called.some(c => c.archivo === card.archivo);

  button.classList.toggle("marked", isMarked);
  button.classList.toggle("called", wasCalled);
  button.setAttribute(
    "aria-label",
    `${card.nombre}, ${isMarked ? "marcada" : "sin marcar"}${wasCalled ? ", ya cantada" : ""}`
  );
}

function refreshBoardCallState() {
  [...board.children].forEach((button, index) => updateBoardCard(button, index));
}

function updateProgress() {
  progress.textContent = `${marked.size} de ${boardCards.length} marcadas`;
}

function renderCurrentCard() {
  const currentCardEl = document.getElementById("currentCard");
  currentCardEl.innerHTML = "";

  if (!called.length) {
    currentCardEl.className = "current-card empty";
    const empty = document.createElement("span");
    empty.textContent = "—";
    currentCardEl.appendChild(empty);
    return;
  }

  const card = called[called.length - 1];
  currentCardEl.className = "current-card";

  const img = document.createElement("img");
  img.src = "cards/" + card.archivo;
  img.alt = card.nombre;

  const number = document.createElement("span");
  number.className = "current-number";
  number.textContent = called.length;

  currentCardEl.appendChild(img);
  currentCardEl.appendChild(number);
  currentCardEl.title = card.nombre;
}

function renderCalledBar() {
  renderCurrentCard();

  [...calledScroll.querySelectorAll(".called-card")].forEach(el => el.remove());

  // The newest card stays in the dedicated "AHORA" slot.
  // Everything else becomes history, newest previous card first.
  const history = called.slice(0, -1).reverse();

  if (!history.length) {
    calledEmpty.style.display = "flex";
    return;
  }

  calledEmpty.style.display = "none";

  history.forEach((card, index) => {
    const originalIndex = called.indexOf(card);

    const item = document.createElement("div");
    item.className = "called-card";
    item.title = card.nombre;

    const img = document.createElement("img");
    img.src = "cards/" + card.archivo;
    img.alt = card.nombre;

    const number = document.createElement("span");
    number.className = "called-number";
    number.textContent = originalIndex + 1;

    item.appendChild(img);
    item.appendChild(number);
    calledScroll.appendChild(item);
  });

  // Keep the most recently moved card visible at the left of the history.
  calledScroll.scrollTo({ left: 0, behavior: "smooth" });
}
function stopTimer() {
  if (timer !== null) {
    clearInterval(timer);
    timer = null;
  }
}

function startTimer() {
  stopTimer();

  if (paused || remaining.length === 0) return;

  timer = setInterval(callCard, levels[currentLevel].interval);
}

function callCard() {
  if (paused || remaining.length === 0) {
    if (!remaining.length) finishCalling();
    return;
  }

  const index = Math.floor(Math.random() * remaining.length);
  const card = remaining.splice(index, 1)[0];
  called.push(card);

  currentCall.textContent = `Última: ${card.nombre}`;
  renderCalledBar();
  refreshBoardCallState();

  const boardIndex = boardCards.findIndex(c => c.archivo === card.archivo);
  if (boardIndex >= 0 && board.children[boardIndex]) {
    const tile = board.children[boardIndex];
    tile.classList.remove("flash");
    void tile.offsetWidth;
    tile.classList.add("flash");
  }

  if (!remaining.length) finishCalling();
}

function finishCalling() {
  stopTimer();
  paused = true;
  pauseBtn.textContent = "CONTINUAR";
  currentCall.textContent = "Se cantaron todas las cartas.";
}

function newGame() {
  stopTimer();
  marked = new Set();
  called = [];
  remaining = shuffle(deck);

  // A fresh 4x4 playable sheet.
  boardCards = shuffle(deck).slice(0, 16);

  paused = true;
  pauseBtn.textContent = "CONTINUAR";
  currentCall.textContent = "Pulsa CONTINUAR para comenzar.";
  renderBoard();
  renderCalledBar();
}

function startGame() {
  if (!imagesReady) return;

  paused = false;
  pauseBtn.textContent = "PAUSAR";
  currentCall.textContent = `Primera carta en ${levels[currentLevel].interval / 1000} segundos.`;

  startTimer();
}

function openLevels() {
  selectedLevel = currentLevel;

  document.querySelectorAll(".level").forEach(button => {
    button.classList.toggle("selected", button.dataset.level === selectedLevel);
  });

  levelOverlay.style.display = "flex";
  levelOverlay.setAttribute("aria-hidden", "false");
}

function closeLevels() {
  levelOverlay.style.display = "none";
  levelOverlay.setAttribute("aria-hidden", "true");
}

async function loadGifFiles() {
  if (gifFiles) return gifFiles;

  // GitHub Pages does not expose directory listings, so ask the public
  // GitHub Contents API for the actual files inside /gif.
  try {
    const response = await fetch(
      "https://api.github.com/repos/andthenbm2-max/LoteriaCNMG/contents/gif",
      { headers: { "Accept": "application/vnd.github+json" } }
    );

    if (response.ok) {
      const files = await response.json();
      gifFiles = files
        .filter(file => file.type === "file" && /\.gif$/i.test(file.name))
        .map(file => file.download_url || ("gif/" + file.name));
    }
  } catch (error) {
    gifFiles = null;
  }

  // Fallback for offline/API-limited situations.
  if (!gifFiles || !gifFiles.length) {
    gifFiles = ["gif/1.gif", "gif/2.gif", "gif/3.gif", "gif/4.gif", "gif/5.gif", "gif/6.gif", "gif/7.gif"];
  }

  return gifFiles;
}

async function showRandomVictoryGif() {
  const gif = document.getElementById("gifVictory");
  const files = await loadGifFiles();
  const selected = files[Math.floor(Math.random() * files.length)];

  // Cache-bust so the animation starts from frame 1 every time.
  gif.src = selected + (selected.includes("?") ? "&" : "?") + "t=" + Date.now();
}

function showVictory() {
  stopTimer();
  paused = true;
  pauseBtn.textContent = "CONTINUAR";
  victoryOverlay.style.display = "flex";
  victoryOverlay.setAttribute("aria-hidden", "false");

  clearTimeout(victoryTimer);
  clearInterval(victoryCountdownTimer);

  const countdown = document.getElementById("victoryCountdown");
  let seconds = 10;
  countdown.textContent = `Nueva partida en ${seconds} segundos…`;

  showRandomVictoryGif();

  victoryCountdownTimer = setInterval(() => {
    seconds--;
    if (seconds > 0) {
      countdown.textContent = `Nueva partida en ${seconds} segundos…`;
    }
  }, 1000);

  victoryTimer = setTimeout(() => {
    clearInterval(victoryCountdownTimer);
    closeVictory();
    newGame();
    startGame();
  }, 10000);
}

function closeVictory() {
  clearTimeout(victoryTimer);
  clearInterval(victoryCountdownTimer);
  victoryOverlay.style.display = "none";
  victoryOverlay.setAttribute("aria-hidden", "true");
}

document.querySelectorAll(".level").forEach(button => {
  button.addEventListener("click", () => {
    selectedLevel = button.dataset.level;

    document.querySelectorAll(".level").forEach(b => {
      b.classList.toggle("selected", b === button);
    });
  });
});

document.getElementById("difficulty").addEventListener("click", openLevels);

document.getElementById("closeLevels").addEventListener("click", closeLevels);

document.getElementById("start").addEventListener("click", () => {
  currentLevel = selectedLevel;
  closeLevels();
  newGame();
  startGame();
});

pauseBtn.addEventListener("click", () => {
  if (!imagesReady || remaining.length === 0) return;

  paused = !paused;

  if (paused) {
    stopTimer();
    pauseBtn.textContent = "CONTINUAR";
    currentCall.textContent = "Juego pausado.";
  } else {
    pauseBtn.textContent = "PAUSAR";
    currentCall.textContent = `Siguiente carta en ${levels[currentLevel].interval / 1000} segundos.`;
    startTimer();
  }
});

document.getElementById("newGame").addEventListener("click", () => {
  newGame();
  openLevels();
});

document.getElementById("victoryNew").addEventListener("click", () => {
  closeVictory();
  newGame();
  openLevels();
});

levelOverlay.addEventListener("click", event => {
  if (event.target === levelOverlay) closeLevels();
});

victoryOverlay.addEventListener("click", event => {
  if (event.target === victoryOverlay) closeVictory();
});

window.addEventListener("resize", calculateBoardLayout);

document.addEventListener("keydown", event => {
  if (event.key === "Escape") {
    closeLevels();
    closeVictory();
  }

  if (
    event.code === "Space" &&
    !/INPUT|TEXTAREA|SELECT|BUTTON/.test(document.activeElement.tagName)
  ) {
    event.preventDefault();
    pauseBtn.click();
  }
});

async function initialize() {
  newGame();

  await preloadImages();

  imagesReady = true;
  preloadProgress.style.width = "100%";
  preloadText.textContent = "¡Cartas listas!";

  setTimeout(() => {
    loading.style.display = "none";
    openLevels();
  }, 250);
}

initialize();
</script>
